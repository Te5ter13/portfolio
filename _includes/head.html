<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <meta name="generator" content="Jekyll">
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}">
  <script>
    (function () {
      var language = localStorage.getItem("preferred-language") || "en";
      document.documentElement.lang = language;
      document.documentElement.dataset.language = language;
    })();
  </script>

  <title>{%if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>

  <link rel="icon" type="image/png" href="{{ "/assets/images/forensic.png" | prepend: site.baseurl | replace: '//', '/' }}">
  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl | replace: '//', '/' }}">
</head>
