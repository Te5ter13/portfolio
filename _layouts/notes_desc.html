---
layout: default
---

<article>
  <p class="eyebrow">{{ page.platform | default: "Notiz" }}</p>
  <h1>{{ page.title }}</h1>

  {% if page.image %}
  <div class="featured-image-post">
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
  </div>
  {% endif %}

  {% if page.description %}
  <div class="desc">{{ page.description }}</div>
  {% endif %}

  {{ content }}
</article>

{% if page.signature %}
<p class="signature">{{ page.signature }}</p>
{% endif %}
