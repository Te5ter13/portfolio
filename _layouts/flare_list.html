---
layout: default
---

<section class="section-intro">
  <p class="eyebrow">Reverse Engineering</p>
  <h1>{{ page.title }}</h1>
  <p>{{ page.description }}</p>
</section>

<div class="card-grid">
  {% for flare in site.flare %}
  <article class="flare-card">
    <a href="{{ flare.url }}" class="read-more">
      <img src="{{ flare.image }}" alt="{{ flare.title }}">
      <div class="card-content">
        <h3>{{ flare.title }}</h3>
        <p class="metadata">{{ flare.description | truncate: 120 }}</p>
      </div>
    </a>
  </article>
  {% endfor %}
</div>
