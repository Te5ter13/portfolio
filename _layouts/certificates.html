---
layout: default
title: "Certificate"
---

<section class="section-intro">
  <p class="eyebrow" data-lang-de="Nachweise" data-lang-en="References">Nachweise</p>
  <h1 data-lang-de="Zertifikate" data-lang-en="Certificates">Zertifikate</h1>
  <p data-lang-de="Eine visuelle &Uuml;bersicht der abgeschlossenen Cybersecurity- und Forensics-Zertifizierungen." data-lang-en="A visual overview of completed cybersecurity and forensics certifications.">Eine visuelle &Uuml;bersicht der abgeschlossenen Cybersecurity- und Forensics-Zertifizierungen.</p>
</section>

<div class="certificates-container">
  {% for cert in site.certificates %}
  <article class="certificate-card">
    <img src="{{ cert.image }}" alt="Zertifikat" class="zoomable" onclick="openModal(this.src)">
  </article>
  {% endfor %}
</div>

<div id="zoomModal" class="modal" onclick="closeModal()">
  <span class="close" onclick="closeModal()">&times;</span>
  <img class="modal-content" id="zoomedImage" alt="Vergroessertes Zertifikat">
</div>

<style>
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.82);
    cursor: pointer;
  }

  .modal-content {
    margin: 6vh auto;
    display: block;
    max-width: min(90vw, 1100px);
    max-height: 86vh;
    border-radius: 8px;
  }

  .modal .close {
    position: fixed;
    top: 20px;
    right: 35px;
    color: #fff;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
  }
</style>

<script>
  function openModal(imageSrc) {
    const modal = document.getElementById('zoomModal');
    const modalImage = document.getElementById('zoomedImage');
    modalImage.src = imageSrc;
    modal.style.display = 'block';
  }

  function closeModal() {
    document.getElementById('zoomModal').style.display = 'none';
  }
</script>
